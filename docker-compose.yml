services:
  # Redis is required for BullMQ background tasks
  redis:
    image: redis:7-alpine
    container_name: cycling-coach-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # MongoDB for the backend data storage
  mongodb:
    image: mongo:6
    container_name: cycling-coach-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  # The backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cycling-coach-backend
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cyclogenai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  # The frontend React/Next.js service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cycling-coach-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  redis_data:
  mongo_data:
